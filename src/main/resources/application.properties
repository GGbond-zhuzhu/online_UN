spring.application.name=backend1
# 服务器配置
server.port=8080
server.servlet.context-path=/
# MySQL数据库配置
spring.datasource.url=jdbc:mysql://localhost:3306/university_online?useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=Ymz2006060311@
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
