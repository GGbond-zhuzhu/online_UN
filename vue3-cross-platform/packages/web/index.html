<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Font Awesome 图标库已通过npm包引入，无需CDN -->
    <title>校园集成系统 - Web端</title>
  </head>
  <body>
    <!-- 兼容部分第三方库（如 sockjs-client）在浏览器中直接访问 Node.js 的 global 变量 -->
    <script>
      // 在浏览器环境中显式为 window 挂一个 global 属性，供依赖库使用，避免 global 未定义导致白屏
      window.global = window;
    </script>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
