# ==================== 基本配置 ====================
spring.application.name=backend
server.port=8080

# ==================== 数据库配置 ====================
# 注意：生产环境请使用环境变量或配置文件加密
# 可以通过环境变量覆盖：DB_URL, DB_USERNAME, DB_PASSWORD
# 示例：export DB_PASSWORD=your_password && mvn spring-boot:run
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/campus_db?createDatabaseIfNotExist=true&useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai}
spring.datasource.username=${DB_USERNAME:root}
# 默认密码不要硬编码到仓库里；请通过环境变量 DB_PASSWORD 覆盖（配合 docker-compose/.env 使用）
spring.datasource.password=${DB_PASSWORD:campus_db_password}

# 初始化SQL
# 如果数据库表已存在且结构不匹配，可以暂时改为 never 让应用先启动
# 启动后可以手动执行SQL修复表结构，或者删除表后重新启动应用
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:init.sql
# 如果初始化失败，继续启动应用（设置为 true 可以让应用先启动起来，方便查看API文档）
spring.sql.init.continue-on-error=true
# spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration
# ==================== MyBatis-Plus配置 ====================

mybatis-plus.configuration.log-impl=org.apache.ibatis.logging.stdout.StdOutImpl
mybatis-plus.global-config.db-config.id-type=auto
mybatis-plus.type-aliases-package=com.yourschool.campussystem.entity
mybatis-plus.mapper-locations=classpath:mapper/*.xml

# ==================== SpringDoc/Knife4j配置 ====================
# SpringDoc OpenAPI 配置
springdoc.api-docs.enabled=true
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.path=/swagger-ui.html
# 配置API文档分组
springdoc.group-configs[0].group=00-全部接口
springdoc.group-configs[0].paths-to-match=/api/**

# Knife4j配置（4.5.0版本基于SpringDoc）
knife4j.enable=true
knife4j.setting.language=zh_cn
knife4j.setting.enable-version=true
knife4j.setting.enable-footer=true
knife4j.setting.footer-content=校园集成系统API文档
knife4j.setting.enable-document-manage=true
knife4j.setting.enable-home-custom=true
knife4j.production=false

# ==================== 文件上传配置 ====================
# 文件上传路径（相对路径或绝对路径）
file.upload.path=./uploads
# 文件访问URL前缀
file.upload.url-prefix=http://localhost:8080/uploads
# 最大文件大小（10MB）
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# ==================== 百度AI云配置 ====================
# 百度AI云人脸识别配置
baidu.ai.app-id=${BAIDU_AI_APP_ID:}
baidu.ai.api-key=${BAIDU_AI_API_KEY:}
baidu.ai.secret-key=${BAIDU_AI_SECRET_KEY:}

# ==================== 高德地图IP定位配置 ====================
# 高德地图IP定位API配置（用于登录日志记录地理位置）
amap.ip-location.key=${AMAP_IP_LOCATION_KEY:}
amap.ip-location.secret=${AMAP_IP_LOCATION_SECRET:}

# ==================== 高德地图Web服务API配置 ====================
# 高德地图Web服务API Key（用于POI搜索、路径规划等）
# App端Key（用于移动端）
amap.web-service.key=${AMAP_WEB_SERVICE_KEY:}
# Web端Key（用于网页端）
amap.web-service.web-key=${AMAP_WEB_SERVICE_WEB_KEY:}
# 安全密钥（用于签名验证）
amap.web-service.secret-key=${AMAP_WEB_SERVICE_SECRET_KEY:}

# ==================== 天眼查企业信息查询配置 ====================
# 天眼查企业基本信息API配置（用于商户资格校验）
# 接口ID: 1116
# 接口名称: 企业基本信息
# 价格: 0.15元/次
tianyancha.api.token=${TIANYANCHA_API_TOKEN:}
tianyancha.api.url=https://open.api.tianyancha.com/services/v3/open/baseInfoV3

# ==================== 邮件服务配置 ====================
# 邮件服务配置（用于发送验证码）
# 如果未配置，验证码仅保存到数据库，不会发送邮件
spring.mail.enabled=false
spring.mail.host=smtp.qq.com
spring.mail.port=587
spring.mail.username=your-email@qq.com
spring.mail.password=your-email-password
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

# ==================== 支付配置（预留真实支付骨架） ====================
# 全局支付模式控制：true 表示始终使用“模拟二维码”（不真正调用支付宝/微信）；
# false 表示允许根据具体支付方式切换到真实支付实现（前提是对应通道的 enabled 也为 true）。
payment.mock-enabled=true

# ------- 支付宝支付配置（占位，暂未真正调用） -------
# 是否启用支付宝真实支付通道（建议在拿到正式/沙箱商户号后，再改为 true）
payment.alipay.enabled=false
# 支付宝开放平台应用AppId（示例：2021000118630000）
payment.alipay.app-id=
# 商户应用私钥（用于签名），请勿直接写正式私钥到代码库，建议通过环境变量覆盖
payment.alipay.merchant-private-key=
# 支付宝公钥（用于验签）
payment.alipay.alipay-public-key=
# 支付结果异步通知地址（示例：http://your-domain.com/api/payment/alipay/notify）
payment.alipay.notify-url=http://localhost:8080/api/payment/alipay/notify
# 支付完成后前端跳转地址（示例：http://your-domain.com/merchant/deposit/result）
payment.alipay.return-url=http://localhost:8080/merchant/deposit/result
# 支付宝网关地址：沙箱环境为 openapi-sandbox，正式环境为 openapi.alipay.com
payment.alipay.gateway-url=https://openapi-sandbox.dl.alipaydev.com/gateway.do

# ------- 微信支付配置（占位，暂未真正调用） -------
# 是否启用微信真实支付通道
payment.wechat.enabled=false
# 微信支付商户号（mchid）
payment.wechat.mch-id=
# 微信支付关联的AppId（公众号 / 小程序 / APP）
payment.wechat.app-id=
# 微信支付API密钥（v2/v3），请勿直接写正式密钥到代码库
payment.wechat.api-key=
# 微信支付统一下单异步通知地址
payment.wechat.notify-url=http://localhost:8080/api/payment/wechat/notify
# 微信支付统一下单接口地址（v2版本默认值）
payment.wechat.unified-order-url=https://api.mch.weixin.qq.com/pay/unifiedorder